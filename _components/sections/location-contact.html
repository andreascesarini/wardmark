<section class="section location-contact" id="location-contact">
  <div class="inner split-section contact-layout">
    <div class="contact-copy">
      <p class="section-eyebrow">Contact</p>
      <h2>Make it easy to <span class="text-accent">reach the business.</span></h2>
      <p>Use this section for the main contact details, service area, office location, phone number, email, and primary inquiry path.</p>

      <div class="contact-actions">
        <button class="button" type="button" data-cta="primary" data-lead-capture>Request a Quote</button>
      </div>

      <div class="contact-card">
        <span class="card-kicker">Business details</span>
        <address class="contact-details">
          <span data-setting="business.address">123 Main Street, Suite 100, Your City, ST 00000</span>
          <a href="tel:5551234567" data-setting-href="business.phone" data-setting-href-type="tel">
            <span data-setting="business.phone">(555) 123-4567</span>
          </a>
          <a href="mailto:hello@example.com" data-setting-href="business.email" data-setting-href-type="email">
            <span data-setting="business.email">hello@example.com</span>
          </a>
        </address>
      </div>
    </div>

    <div class="map-placeholder" data-integration="map"></div>
  </div>
</section>
